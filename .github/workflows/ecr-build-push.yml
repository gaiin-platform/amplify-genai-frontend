name: Docker image build and publish

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      enable_ecr_workflow:
        description: 'Enable ECR workflow'
        type: boolean
        default: false
        required: true

env:
  SCAN_IMAGE: amplify-frontend:scan-${{ github.sha }}

jobs:
  docker:
    name: build-scan-push
    runs-on: ubuntu-latest
    # Only assign environment for push events to main/dev (not for PRs)
    environment: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' && 'production' || 'development') || '' }}

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.set-outputs.outputs.image_tag }}
      full_image: ${{ steps.set-outputs.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build into the local Docker daemon only (nothing is pushed yet) so the
      #    exact image that gets scanned is the image that gets pushed.
      - name: Build image (local, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.SCAN_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Trivy gate. Policy (see .trivyignore for exceptions):
      #    - CRITICAL: always blocks, even when no fix exists.
      #    - HIGH: blocks only when a fix has been released (unfixed HIGH is bypassed).
      #    Both passes run (!cancelled) so a failure report shows everything at once.
      #    Third-party actions are pinned to a commit SHA; update the SHA deliberately.
      - name: Trivy scan - CRITICAL (blocking, includes unfixed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Trivy scan - HIGH (blocking only if a fix exists)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      # 3. Everything below runs only if both scans passed, and never on PRs.
      #    PR runs have no environment, so environment-scoped vars (AWS_REGION, etc.)
      #    are not available to them.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      # Push the already-scanned image (no rebuild) for pushes to main/dev.
      - name: Tag and push scanned image
        id: build-publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          docker tag "$SCAN_IMAGE" "$ECR_IMAGE:${{ github.sha }}"
          docker tag "$SCAN_IMAGE" "$ECR_IMAGE:latest"
          docker push "$ECR_IMAGE:${{ github.sha }}"
          docker push "$ECR_IMAGE:latest"

      - name: Set output values
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: set-outputs
        run: |
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "full_image=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Force new deployment of ECS service
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }}

      - name: Wait for service stability
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }} \
            --region ${{ vars.AWS_REGION }}